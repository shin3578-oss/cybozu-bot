# ==========================================================
# 【何をする】サイボウズの掲示板の投稿をキーワードで探して読む（読み取りのみ・調査用）
# 【いつ動く】手動のみ。2026-11-16 医局をめぐる住民とのやり取りを遡るため
# 【なぜここにあるか】サイボウズの認証情報はこのリポジトリのSecretsにしかないため
# 【注意】このリポジトリは公開＝ログは誰でも読める。本文は暗号化して出す（院長のPCだけが開ける）
# ==========================================================
name: サイボウズ 掲示板の読み取り（調査用）

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt cryptography

      - name: Playwright ブラウザをインストール
        run: |
          for i in 1 2 3; do
            if playwright install chromium --with-deps; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: 掲示板を読む（暗号化して出力）
        env:
          CYBOZU_URL: ${{ secrets.CYBOZU_URL }}
          CYBOZU_LOGIN_ID: ${{ secrets.CYBOZU_LOGIN_ID }}
          CYBOZU_PASSWORD: ${{ secrets.CYBOZU_PASSWORD }}
        run: python dump_bulletin.py
