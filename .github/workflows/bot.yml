# ==========================================================
# 【何をする】サイボウズの日報・週報をAI添削して自動承認（＋勤怠・給与・CSV突合・練習台帳ランキングの月次起動役
#            ＋ジョブメドレー応募者ラリーの承認見張り＝院長がOKを入れたら送信を起こす
#            ＋GitHub Actions 無料枠の見張り＝毎日9:00に非公開リポジトリの消費を測る）
# 【いつ動く】30分ごと｜Cron-job.org「サイボウズBot」ジョブが起動
# ==========================================================
name: サイボウズ 日報・設備使用許可書 自動承認

on:
  workflow_dispatch:  # Cron-job.org から呼び出す（30分ごと）

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 30分ごとに毎日動くこのワークフローを「時計」として使い、
      # 月次ボットを所定の日時に起動する（Cron-job.org 無料枠12件の節約のため）。
      # 起動は毎時00分の回のみ。起動失敗時はこのステップが失敗して通知される。
      - name: 月次ボット起動判定（勤怠・給与・歩合突合）
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          DAY=$(TZ=Asia/Tokyo date +%d)
          HOUR=$(TZ=Asia/Tokyo date +%H)
          MIN=$(TZ=Asia/Tokyo date +%M)
          echo "JST: ${DAY}日 ${HOUR}:${MIN}"
          if [ $((10#$MIN)) -ge 30 ]; then
            echo "毎時30分の回のためスキップ"
            exit 0
          fi
          dispatch() {
            curl -sf -X POST \
              -H "Authorization: token $DISPATCH_PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/shin3578-oss/$1/actions/workflows/$2/dispatches" \
              -d '{"ref":"main"}' \
              && echo "→ $1 起動OK" \
              || { echo "→ $1 起動失敗"; exit 1; }
          }
          # 勤怠自動集計: 毎月5日 21:00 JST
          if [ "$DAY" = "05" ] && [ "$HOUR" = "21" ]; then
            dispatch kintai-automation kintai_auto.yml
          fi
          # コンサル歩合突合（前月分）: 毎月1日 9:00 JST
          if [ "$DAY" = "01" ] && [ "$HOUR" = "09" ]; then
            dispatch apotool-automation csv_matching.yml
          fi
          # 給与振込チェック: 毎月10〜14日 9:00 / 13:00 / 18:00 JST
          case "$DAY" in
            10|11|12|13|14)
              if [ "$HOUR" = "09" ] || [ "$HOUR" = "13" ] || [ "$HOUR" = "18" ]; then
                dispatch payroll-check-bot payroll_check.yml
              fi
              ;;
          esac
          # 練習台帳ランキング（1月〜前月末の提出率→スプシ更新→全体チャンネルへ投稿）:
          # 毎月6日 9:00 JST。6日が休診日なら次の診療日の9:00（2026-10-05 院長指示）。
          # 勤怠CSVが前月分そろうのを待つため5日の勤怠集計より後ろに置く。
          # 休診日は公開 closed_days.json で判定。読めなければ日曜だけ休みとして続行（診療日扱い）
          if [ "$HOUR" = "09" ] && [ $((10#$DAY)) -ge 6 ] && [ $((10#$DAY)) -le 15 ]; then
            FIRST=$(python3 - <<'PY'
          import json, urllib.request, datetime
          jst = datetime.timezone(datetime.timedelta(hours=9))
          today = datetime.datetime.now(jst).date()
          try:
              closed = set(json.load(urllib.request.urlopen(
                  "https://shin3578-oss.github.io/kds-dashboard/closed_days.json", timeout=20))["days"])
          except Exception as e:
              print(f"closed_days.json を読めません（{e}）→日曜だけ休みとして判定", file=__import__("sys").stderr)
              closed = set()
          d = today.replace(day=6)
          while d.weekday() == 6 or d.isoformat() in closed:
              d += datetime.timedelta(days=1)
          print("yes" if d == today else "no")
          PY
          )
            echo "練習台帳ランキング: 今日が6日以降の最初の診療日か → $FIRST"
            if [ "$FIRST" = "yes" ]; then
              dispatch kintai-automation renshu_daicho.yml
            fi
          fi

      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------------
      # GitHub Actions 無料枠の見張り（毎日 9:00 JST の回だけ）
      #
      # 2026-08-30 14:30、無料枠（月2,000分）を使い切って apotool-automation の
      # 自動化が丸1日まるごと止まった。しかも誰にも知らせが行かなかった。
      # 失敗通知Bot（if: failure()）も消費レポートも、止まったのと同じ非公開リポジトリの
      # 中にあったからで、枠切れではジョブ自体が起動しない＝通知も一緒に黙る。
      # 見張りは、見張る対象と別の場所に置かないと意味がない。
      # このリポジトリは公開＝Actionsが無料・無制限なので、枠が尽きても動き続ける。
      #
      # 8割超えで警告、使い切りで停止通知。余裕があるときは何も言わない。
      # 通知はLINEワークスの鍵を持つ deadline-alert（公開）に頼む。
      # 独立ジョブにしないのは、公開リポジトリでもジョブを増やす意味がないため（CLAUDE.md ルール9）。
      # continue-on-error … 見張りがコケてもサイボウズBot本体を巻き込まない。
      # ------------------------------------------------------------------
      - name: GitHub Actions 無料枠の見張り（毎日9:00の回のみ）
        continue-on-error: true
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          HOUR=$(TZ=Asia/Tokyo date +%H)
          MIN=$(TZ=Asia/Tokyo date +%M)
          if [ "$HOUR" != "09" ] || [ $((10#$MIN)) -ge 30 ]; then
            echo "9:00の回ではない（JST ${HOUR}:${MIN}）→ スキップ"
            exit 0
          fi
          python actions_quota_watch.py

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: Playwright ブラウザをインストール
        # Microsoftのaptリポジトリ署名エラー等の一過性障害で --with-deps が
        # 丸ごと失敗しないよう、最大3回リトライする（2026-07-08導入）。
        run: |
          for i in 1 2 3; do
            echo "ブラウザインストール 試行 $i/3"
            if playwright install chromium --with-deps; then
              echo "→ 成功"
              exit 0
            fi
            echo "→ 失敗。10秒待って再試行..."
            sleep 10
          done
          echo "3回とも失敗しました" >&2
          exit 1

      # ------------------------------------------------------------------
      # ジョブメドレー応募者ラリー：院長が承認列に「OK」を入れた行があれば、
      # apotool の送信ワークフローを起こす（承認から最長30分で応募者へ届く）。
      # ここは読むだけ。応募者には何も送らない。
      # このリポジトリは公開＝Actionsの無料枠を消費しないので、見張り役に向いている。
      # 承認が無ければ数秒で終わるので、独立ジョブにはせずステップとして置いている。
      # ------------------------------------------------------------------
      - name: ジョブメドレー応募者ラリーの承認を見張る
        if: false  # 一時停止中（2026-08-24 院長指示）／再開するときは always() に戻す
        continue-on-error: true
        env:
          DRIVE_TOKEN_JSON:         ${{ secrets.DRIVE_TOKEN_JSON }}
          JOBMEDLEY_REPLY_SHEET_ID: ${{ secrets.JOBMEDLEY_REPLY_SHEET_ID }}
          DISPATCH_PAT:             ${{ secrets.DISPATCH_PAT }}
        run: python jobmedley_approval_watch.py

      - name: ボットを実行
        env:
          CYBOZU_URL: ${{ secrets.CYBOZU_URL }}
          CYBOZU_LOGIN_ID: ${{ secrets.CYBOZU_LOGIN_ID }}
          CYBOZU_PASSWORD: ${{ secrets.CYBOZU_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py
