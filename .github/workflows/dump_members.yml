# ==========================================================
# 【何をする】サイボウズのメンバー一覧から氏名とメールアドレスを取り出す（読み取りのみ）
# 【いつ動く】手動のみ。雇用契約アプリに登録するアドレスを集めるための調査用
# 【なぜここにあるか】サイボウズの認証情報はこのリポジトリのSecretsにしかないため
# ==========================================================
name: サイボウズ メンバー一覧の取得（調査用）

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt requests

      - name: メンバー一覧を取得
        env:
          CYBOZU_URL: ${{ secrets.CYBOZU_URL }}
          CYBOZU_LOGIN_ID: ${{ secrets.CYBOZU_LOGIN_ID }}
          CYBOZU_PASSWORD: ${{ secrets.CYBOZU_PASSWORD }}
        run: python dump_members.py
